name: CI

on:
  push:
    branches:
      - develop
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  format-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      failed: ${{ steps.result.outputs.failed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        id: check
        continue-on-error: true
        run: npm run format:check

      - name: Record formatting result
        id: result
        if: always()
        run: echo "failed=${{ steps.check.outcome == 'failure' }}" >> "$GITHUB_OUTPUT"

  lint-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      failed: ${{ steps.result.outputs.failed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check lint
        id: check
        continue-on-error: true
        run: npm run lint

      - name: Record lint result
        id: result
        if: always()
        run: echo "failed=${{ steps.check.outcome == 'failure' }}" >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Write coverage summary
        if: always()
        run: node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  autofix:
    if: >-
      always() &&
      (needs.format-check.outputs.failed == 'true' || needs.lint-check.outputs.failed == 'true') &&
      (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    needs:
      - format-check
      - lint-check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      BRANCH_NAME: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.BRANCH_NAME }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fix formatting
        if: needs.format-check.outputs.failed == 'true'
        run: npm run format

      - name: Fix lint
        if: needs.lint-check.outputs.failed == 'true'
        run: npm run lint:fix

      - name: Commit fixes
        run: |
          if git diff --quiet; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: CI 自動修正"
          git push origin HEAD:${BRANCH_NAME}

  verify:
    if: always()
    needs:
      - format-check
      - lint-check
      - autofix
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BRANCH_NAME: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && github.sha || env.BRANCH_NAME }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify formatting
        run: npm run format:check

      - name: Verify lint
        run: npm run lint
